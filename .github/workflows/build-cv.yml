name: Build LaTeX CV

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compile with upstream TeX Live image over HTTPS (no third-party action internals).
      # fail-fast: false so we always get the log even when compilation breaks.
      - name: Set up LaTeX
        id: latex
        run: |
          set -o pipefail
          docker pull ghcr.io/xu-cheng/texlive-full:latest
          docker run --rm -v "$PWD":/workdir -w /workdir \
            ghcr.io/xu-cheng/texlive-full:latest \
            latexmk -pdf -file-line-error -interaction=nonstopmode main.tex 2>&1 | tee latex_out.log
          echo "=== latex_out.log ==="
          cat latex_out.log
          echo "=== main.log (errors) ==="
          [ -f main.log ] && grep -n -A4 -E '^!|^[^ ]*main\.tex:[0-9]+:' main.log | head -100 || echo "(no main.log)"

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: |
            latex_out.log
            main.log
          if-no-files-found: warn

      - name: Prepare PDF for release branch
        run: |
          ls -l main.pdf
          mkdir -p /tmp/cv_release
          cp main.pdf /tmp/cv_release/main.pdf

      - name: Create release branch with only PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout --orphan temp_release
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          cp /tmp/cv_release/main.pdf .
          git add main.pdf
          git commit -m "Update CV PDF"
          git push -f origin temp_release:release

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --title "Release v${{ github.run_number }}" \
            --notes "Automated CV PDF build." \
            "./main.pdf"
