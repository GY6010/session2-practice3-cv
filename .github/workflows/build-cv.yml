name: Build LaTeX CV

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pull the upstream TeX Live image over HTTPS and run latexmk inside it.
      # This avoids depending on third-party action internals that can change.
      - name: Set up LaTeX
        run: |
          docker pull ghcr.io/xu-cheng/texlive-full:latest
          docker run --rm -v "$PWD":/workdir -w /workdir \
            ghcr.io/xu-cheng/texlive-full:latest \
            latexmk -pdf -file-line-error -interaction=nonstopmode main.tex

      - name: Prepare PDF for release branch
        run: |
          ls -l main.pdf
          mkdir -p /tmp/cv_release
          cp main.pdf /tmp/cv_release/main.pdf

      - name: Create release branch with only PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout --orphan temp_release
          # Remove all files and folders except .git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          cp /tmp/cv_release/main.pdf .
          git add main.pdf
          git commit -m "Update CV PDF"
          git push -f origin temp_release:release

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --title "Release v${{ github.run_number }}" \
            --notes "Automated CV PDF build." \
            "./main.pdf"
